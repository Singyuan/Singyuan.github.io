- title: "High-Order Synchrosqueezed Chirplet Transforms for Multicomponent Signal Analysis"
  authors: "Yi-Ju Yen, De-Yan Lu, Sing-Yuan Yeh, Jian-Jiun Ding, and Chun-Yen Shen"
